<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Consultation de l'attestation CNPS">
  <title>Attestation CNPS - BABATCHE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 850px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,.10);
      padding: 28px;
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: #667085; margin: 8px 0 22px; }
    .pdf {
      width: 100%;
      height: 70vh;
      min-height: 500px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 20px;
      background: #f8fafc;
    }
    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    a {
      display: inline-block;
      text-decoration: none;
      padding: 13px 20px;
      border-radius: 9px;
      font-weight: 700;
    }
    .primary { background: #0b6bcb; color: white; }
    .secondary { background: #eef2f6; color: #1f2937; }
    small { display: block; margin-top: 18px; color: #98a2b3; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Attestation CNPS</h1>
    <p>Document officiel — BABATCHE</p>

    <iframe
      class="pdf"
      src="CNPS%20BABATCHE.pdf"
      title="Attestation CNPS BABATCHE">
      Votre navigateur ne permet pas d'afficher le PDF.
    </iframe>

    <div class="buttons">
      <a class="primary" href="CNPS%20BABATCHE.pdf" target="_blank" rel="noopener">
        Ouvrir le document
      </a>
      <a class="secondary" href="CNPS%20BABATCHE.pdf" download>
        Télécharger le PDF
      </a>
    </div>

    <small>Page de consultation de l'attestation CNPS</small>
  </main>
</body>
</html>
